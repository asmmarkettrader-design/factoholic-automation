name: Auto Upload Daily
on:
  schedule:
    # 13:00 UTC کا مطلب پاکستان کا شام 6:00 بجے اور انڈیا کا 6:30 بجے ہے
    - cron: '0 13 * * *'
  workflow_dispatch: # یہ لائن مینوئل رن کے لیے ہے (جب آپ خود بٹن دبائیں)

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          
      - name: Run Script
        run: python script.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_WEBHOOK_URL: ${{ secrets.BUFFER_WEBHOOK_URL }}
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # اگر ہسٹری فائل نہیں بنی تو یہ خود بنا لے گا تاکہ ایرر نہ آئے
          touch history.txt  
          git add history.txt
          # ویڈیوز کے فولڈر سے جو بھی فائل ڈیلیٹ ہوئی ہے، اسے اپڈیٹ کرنا
          git add -A videos/ || true
          git commit -m "Auto-update: History logged and processed video removed" || echo "No changes to commit"
          # گٹ ہب پر پش کرنے سے پہلے نیا ڈیٹا پل (pull) کرنا تاکہ rejected والا ایرر نہ آئے
          git pull --rebase origin main
          git push
