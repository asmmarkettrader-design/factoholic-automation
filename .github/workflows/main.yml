name: Factoholic Automated Viral Engine via Webhook

on:
  schedule:
    - cron: '0 4 * * *'   # پاکستانی وقت کے مطابق صبح 9 بجے
    - cron: '0 14 * * *'  # پاکستانی وقت کے مطابق شام 7 بجے
  workflow_dispatch:

jobs:
  viral_upload_slot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Configure Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Mount FFmpeg Engine & Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        pip install google-genai requests

    - name: Run Factoholic Automation Script
      env:
        BUFFER_WEBHOOK_URL: ${{ secrets.BUFFER_WEBHOOK_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python script.py

    - name: Secure Git History Auto-Sync
      run: |
        git config --global user.name "Factoholic Action Bot"
        git config --global user.email "actions@github.com"
        git add uploaded_history.txt || true
        git add videos/ || true
        git stash || true
        git pull --rebase origin main || true
        git stash pop || true
        git add uploaded_history.txt videos/ || true
        git commit -m "🤖 Bot Log: Synced workspace history" || true
        git push origin main || true
