name: Video Automation Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # وارننگ ختم کرنے کے لیے پائیتھن 3.11 اپڈیٹ کر دیا ہے

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai

    - name: Run Video Automation Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BUFFER_WEBHOOK_URL: ${{ secrets.BUFFER_WEBHOOK_URL }}
      run: python script.py

    - name: Commit and Push Deletion
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add videos/
        git diff-index --quiet HEAD || git commit -m "Automated: Deleted processed video"
        git push
