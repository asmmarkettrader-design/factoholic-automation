name: Auto Upload Daily
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

# یہ پرمیشن گٹ ہب ایکشن کو فائلیں ڈیلیٹ اور سیو کرنے کی اجازت دے گی (403 Error Fix)
permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          
      - name: Run Script
        run: python script.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_WEBHOOK_URL: ${{ secrets.BUFFER_WEBHOOK_URL }}
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          touch history.txt  
          git add history.txt
          git add -A videos/ || true
          git commit -m "Auto-update: History logged and processed video removed" || echo "No changes to commit"
          git pull --rebase origin main
          git push
