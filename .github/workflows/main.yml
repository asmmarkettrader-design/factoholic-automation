name: Auto Upload Daily
on:
  schedule:
    # روزانہ پاکستان کے شام 6:00 بجے چلے گا (13:00 UTC)
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          
      - name: Run Script
        run: python script.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_WEBHOOK_URL: ${{ secrets.BUFFER_WEBHOOK_URL }}
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # ہسٹری فائل کو سٹیج کرنا
          git add history.txt
          # ویڈیوز فولڈر میں ہونے والی تمام تبدیلیاں (ڈیلیٹ ہونا) سٹیج کرنا
          git add -A videos/
          git commit -m "Auto-update: History logged and processed video removed" || echo "No changes to commit"
          git push
