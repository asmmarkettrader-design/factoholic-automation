name: Factoholic Auto Uploader via Buffer

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 12 * * *'  # روزانہ پاکستانی وقت کے مطابق شام 5 بجے (UTC 12:00) خود چلے گا

jobs:
  post-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Automation Script
      env:
        BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }} # گٹ ہب سیکریٹ کا استعمال
      run: python script.py
